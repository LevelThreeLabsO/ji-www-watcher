name: JI WWW watcher

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: python3 poll.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LIVE_BRIEFING_WEBHOOK: ${{ secrets.LIVE_BRIEFING_WEBHOOK }}
          JI_COOKIE: ${{ secrets.JI_COOKIE }}
          JI_BYPASS_TOKEN: ${{ secrets.JI_BYPASS_TOKEN }}
      # Alert only on the FIRST failure of a streak — if the previous completed
      # run also failed, stay quiet so a broken state can't flood the channel.
      - name: Alert Slack if the run failed (once per streak)
        if: failure()
        run: |
          prev=$(gh run list --workflow poll.yml --branch main --status completed \
                   --limit 1 --json conclusion -q '.[0].conclusion' 2>/dev/null || echo "")
          if [ "$prev" = "failure" ]; then
            echo "Previous run already failed — suppressing duplicate alert."
            exit 0
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"username\":\"LB Watcher\",\"text\":\":rotating_light: *LB Watcher run FAILED* (first of a streak — you won't be pinged again until it recovers). Log: $RUN_URL\"}" \
            "$SLACK_WEBHOOK_URL" || true
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
