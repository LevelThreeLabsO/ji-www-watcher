name: JI WWW watcher

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: python3 poll.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LIVE_BRIEFING_WEBHOOK: ${{ secrets.LIVE_BRIEFING_WEBHOOK }}
          JI_COOKIE: ${{ secrets.JI_COOKIE }}
          JI_BYPASS_TOKEN: ${{ secrets.JI_BYPASS_TOKEN }}
      # Alert only when we hit the 3rd consecutive failure. Isolated blips
      # (single JI 5xx / network hiccup) get swallowed entirely; only sustained
      # outages ping. On the 3rd fail we alert once, then stay quiet until a run
      # succeeds again.
      - name: Alert Slack if 3 consecutive runs have failed
        if: failure()
        run: |
          prev=$(gh run list --workflow poll.yml --branch main --status completed \
                   --limit 3 --json conclusion -q '[.[].conclusion] | join(",")' 2>/dev/null || echo "")
          # This run counts as the 3rd. Alert only if the two PRIOR completed runs both failed.
          two_prior=$(echo "$prev" | cut -d, -f1,2)
          if [ "$two_prior" != "failure,failure" ]; then
            echo "Not yet a 3-in-a-row failure streak (prior completed runs: $prev) — suppressing alert."
            exit 0
          fi
          # If the run BEFORE those two also failed, we've already alerted on this streak.
          third_back=$(echo "$prev" | cut -d, -f3)
          if [ "$third_back" = "failure" ]; then
            echo "Streak already alerted on — staying quiet."
            exit 0
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"username\":\"LB Watcher\",\"text\":\":rotating_light: *LB Watcher: 3 consecutive runs FAILED.* You won't be pinged again until it recovers. Log: $RUN_URL\"}" \
            "$SLACK_WEBHOOK_URL" || true
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
